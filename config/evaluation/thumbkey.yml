metrics:
  # layout metrics
  # Each keystroke incurs a cost (defined in the keyboard's layout config)
  key_costs:
    enabled: true
    weight: 10.0
    normalization:
      type: weight_found
      value: 1.0
    params:
      null: null

  thumb_key:
    enabled: false
    weight: 1.0
    normalization:
      type: weight_found
      value: 1.0
    params:
      null: null

  thumb_key_collisions:
    enabled: false
    weight: 1.0
    normalization:
      type: weight_found
      value: 1.0
    params:
      tap_cost: 0.0
      position_coincidence_bonus: 10.0
      swipe_penalty: 0.0
      switch_bonus: 0.0
      switch_collision_penalty: 0.0
      double_switch_collision_penalty: 0.0

  tk_distance:
    enabled: false
    weight: 0.1
    normalization:
      type: weight_found
      value: 1.0
    params:
      swipe_distance: 0.75

  tk_same_key:
    enabled: true
    weight: 500.0
    normalization:
      type: weight_found
      value: 1.0
    params:
      null: null

  hand_switches:
    enabled: false
    weight: 2.0
    normalization:
      type: weight_found
      value: 1.0
    params:
      null: null

  hand_disbalance:
    enabled: false
    weight: 0.1
    normalization:
      type: fixed
      value: 1.0
    params:
      null: null

  tk_collision:
    enabled: false
    weight: 1.0
    normalization:
      type: weight_found
      value: 1.0
    params:
      weak_collision_weight: 0.5

  tk_hand_switch_distance:
    enabled: false
    weight: 0.1
    normalization:
      type: weight_found
      value: 1.0
    params:
      swipe_distance: 0.0

  tk_hand_switch_same_key:
    enabled: false
    weight: 0.2
    normalization:
      type: weight_found
      value: 1.0
    params:
      null: null



ngrams:
  # Increase the weight of bigrams that have both an absolute weight and relative weight exceed
  # specified thresholds.
  increase_common_ngrams:
    enabled: false
    # Bigrams with a relative weight exceeding this threshold are considered
    critical_fraction: 0.001
    # The weight for bigrams exceeding both thresholds is multiplied by this factor
    factor: 2.0
    # Bigrams with an absolute weight exceeding this threshold are considered
    total_weight_threshold: 20.0


ngram_mapper:
  # Exclude ngrams that contain a line break, followed by a non-line-break character.
  # This encodes a mental pause which usually comes after hitting the "Enter" key, before
  # continuing to write.
  exclude_line_breaks: true

  # Split symbols belonging to higher layers of the layout into combinations involving modifiers
  # required to activate the layer
  split_modifiers:
    enabled: false
    # Multiply the ngram's weight with this factor whenever the resulting ngram involves two
    # modifiers that are required for the same symbol
    same_key_mod_factor: 0.03125
